services:
  - type: web
    name: rag-based-model
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker backend:app --bind 0.0.0.0:$PORT --workers 1 --timeout 180
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: HF_TOKEN
        sync: false
      - key: EMBEDDING_BACKEND
        value: fastembed
      - key: USE_REMOTE_LLM
        value: "true"
      - key: USE_EXTRACTIVE_ONLY
        value: "true"
      - key: MODEL_NAME
        value: Qwen/Qwen2.5-0.5B-Instruct
      - key: OWASP_EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: MITRE_EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: HF_ROUTER_BASE_URL
        value: https://router.huggingface.co/v1
      - key: REQUEST_TIMEOUT_SEC
        value: "90"
