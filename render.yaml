services:
  - type: web
    name: rag-based-model
    runtime: python
    plan: free
    # Do NOT run ingest here — it OOMs on 512MB. Build chroma_db locally and commit it.
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker backend:app --bind 0.0.0.0:$PORT --workers 1 --timeout 180
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: HF_TOKEN
        sync: false
      - key: EMBEDDING_BACKEND
        value: fastembed
      - key: AUTO_BUILD_OWASP_DB
        value: "false"
      - key: USE_REMOTE_LLM
        value: "false"
      - key: USE_EXTRACTIVE_ONLY
        value: "true"
      - key: OWASP_EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: MITRE_EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: REQUEST_TIMEOUT_SEC
        value: "90"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: ORT_LOG_SEVERITY_LEVEL
        value: "3"
